    <script>
        'use strict';

        const CONFIG = {
            DEFAULT_STACK: 1000, DEFAULT_SB: 5, DEFAULT_BB: 10,
            MIN_PLAYERS: 2, MAX_PLAYERS: 10, MAX_NAME_LENGTH: 20,
            ANIMATION_THRESHOLD: 100, ANIMATION_DURATION: 300,
            SAVE_KEY: 'lpt_state'
        };

        const STREET_LABELS = { preflop: '翻牌前', flop: '翻牌', turn: '转牌', river: '河牌', showdown: '摊牌' };

        let state = {
            players: [],
            pot: 0, currentBet: 0, currentPlayerIndex: 0,
            roundActive: false, street: 'preflop',
            buttonPosition: 0, minRaise: 0,
            toAct: new Set(),
            handHistory: [], handCount: 0,
            tournament: { active: false, levelMinutes: 20, secondsLeft: 0, level: 1 }
        };

        let _rebuyPlayerIdx = -1, _timerInterval = null, _saveTimer = null;
        let _renamePlayerIdx = -1;

        const $ = id => document.getElementById(id);
        const els = {
            playerName: $('playerName'), playerStack: $('playerStack'),
            pot: $('pot'), currentBet: $('currentBet'),
            currentPlayerName: $('currentPlayerName'), streetName: $('streetName'),
            players: $('players'), amount: $('amount'),
            emptyPotModal: $('emptyPotModal'), winnerSelect: $('winnerSelect'),
            modalPotAmount: $('modalPotAmount'),
            smallBlind: $('smallBlind'), bigBlind: $('bigBlind'),
            blindsControls: $('blindsControls')
        };

        // ── Toast ────────────────────────────────────────────────
        let _toastTimer;
        const toast = (msg, type = '') => {
            const el = $('toast');
            el.textContent = msg;
            el.className = 'show' + (type ? ' toast-' + type : '');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => { el.className = ''; }, 3500);
        };

        // ── Persistence ──────────────────────────────────────────
        const serializeState = () => ({ ...state, toAct: [...state.toAct] });

        const saveState = () => {
            try {
                const s = serializeState();
                if (s.tournament.active) s.tournament.savedAt = Date.now();
                localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(s));
            } catch(e) {}
        };

        const debouncedSave = () => { clearTimeout(_saveTimer); _saveTimer = setTimeout(saveState, 300); };

        const loadSavedState = () => {
            try {
                const raw = localStorage.getItem(CONFIG.SAVE_KEY);
                if (!raw) return false;
                const s = JSON.parse(raw);
                if (!s.players || s.players.length === 0) return false;
                state = {
                    ...s,
                    toAct: new Set(s.toAct || []),
                    handHistory: s.handHistory || [],
                    handCount: s.handCount || 0,
                    tournament: s.tournament || { active: false, levelMinutes: 20, secondsLeft: 0, level: 1 }
                };
                // Ensure all players have handContrib (added in this version)
                state.players.forEach(p => { if (p.handContrib == null) p.handContrib = 0; });
                // Adjust timer for time elapsed while page was closed
                const t = state.tournament;
                if (t.active && t.savedAt) {
                    const elapsed = Math.floor((Date.now() - t.savedAt) / 1000);
                    t.secondsLeft = Math.max(0, t.secondsLeft - elapsed);
                }
                return true;
            } catch(e) { return false; }
        };

        // ── Tournament timer ─────────────────────────────────────
        const formatTime = secs => {
            const m = Math.floor(Math.abs(secs) / 60);
            const s = Math.abs(secs) % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        };

        const syncTimerDisplay = () => {
            const t = state.tournament;
            if (!t.active) { $('timerDisplay').classList.add('hidden'); return; }
            $('timerDisplay').classList.remove('hidden');
            $('timerLevel').textContent = `第 ${t.level} 级`;
            $('timerCountdown').textContent = formatTime(t.secondsLeft);
            $('timerCountdown').classList.toggle('timer-urgent', t.secondsLeft <= 60 && t.secondsLeft > 0);
        };

        const bumpBlinds = () => {
            const sb = parseInt(els.smallBlind.value) || CONFIG.DEFAULT_SB;
            const bb = parseInt(els.bigBlind.value)   || CONFIG.DEFAULT_BB;
            const round5 = n => Math.max(5, Math.round(n * 1.5 / 5) * 5);
            els.smallBlind.value = round5(sb);
            els.bigBlind.value   = round5(bb);
            state.tournament.level++;
            state.tournament.sb = parseInt(els.smallBlind.value);
            state.tournament.bb = parseInt(els.bigBlind.value);
            toast(`第 ${state.tournament.level} 级 — 盲注 ${els.smallBlind.value}/${els.bigBlind.value}`, 'win');
        };

        const runTimerTick = () => {
            const t = state.tournament;
            if (t.secondsLeft <= 0) {
                bumpBlinds();
                t.secondsLeft = t.levelMinutes * 60;
            } else {
                t.secondsLeft--;
            }
            syncTimerDisplay();
            debouncedSave();
        };

        const startTimer = () => {
            clearInterval(_timerInterval);
            const t = state.tournament;
            t.active = true;
            t.levelMinutes = parseInt($('levelMinutes').value) || 20;
            t.secondsLeft = t.levelMinutes * 60;
            $('timerBtn').textContent = '停止计时';
            syncTimerDisplay();
            _timerInterval = setInterval(runTimerTick, 1000);
        };

        const stopTimer = () => {
            clearInterval(_timerInterval); _timerInterval = null;
            state.tournament.active = false;
            $('timerBtn').textContent = '开始计时';
            syncTimerDisplay();
        };

        const resumeTimer = () => {
            if (!state.tournament.active) return;
            $('timerBtn').textContent = '停止计时';
            $('levelMinutes').value = state.tournament.levelMinutes;
            _timerInterval = setInterval(runTimerTick, 1000);
            syncTimerDisplay();
        };

        // ── Animate numbers ──────────────────────────────────────
        const animateNumber = (el, newVal) => {
            const oldVal = parseInt(el.textContent) || 0;
            if (oldVal === newVal) return;
            el.classList.add('chip-update');
            setTimeout(() => el.classList.remove('chip-update'), CONFIG.ANIMATION_DURATION);
            if (Math.abs(newVal - oldVal) > CONFIG.ANIMATION_THRESHOLD) {
                let cur = oldVal;
                const step = (newVal - oldVal) / 10;
                const iv = setInterval(() => {
                    cur += step;
                    if ((step > 0 && cur >= newVal) || (step < 0 && cur <= newVal)) {
                        el.textContent = newVal; clearInterval(iv);
                    } else { el.textContent = Math.round(cur); }
                }, 20);
            } else { el.textContent = newVal; }
        };

        // ── Render ───────────────────────────────────────────────
        const render = () => {
            animateNumber(els.pot, state.pot);
            animateNumber(els.currentBet, state.currentBet);
            els.streetName.textContent = STREET_LABELS[state.street] || '—';

            const atShowdown = state.street === 'showdown';
            const curP = state.roundActive ? state.players[state.currentPlayerIndex] : null;

            $('toActBanner').style.display = curP && !atShowdown ? 'flex' : 'none';
            if (curP) {
                els.currentPlayerName.textContent = curP.name;
                const toCall = Math.min(state.currentBet - curP.bet, curP.stack);
                $('callBtn').textContent = `跟注 ${toCall}`;
            }

            const n = state.players.length;
            els.players.innerHTML = state.players.map((p, i) => {
                const isActive = i === state.currentPlayerIndex && state.roundActive && !atShowdown;
                const isBtn = n >= 2 && i === state.buttonPosition;
                const isSB  = n >= 3 && i === (state.buttonPosition + 1) % n;
                const isBB  = n >= 2 && i === (state.buttonPosition + (n === 2 ? 1 : 2)) % n;
                const badges = [
                    isBtn ? '<span class="badge badge-btn">庄家</span>' : '',
                    isSB  ? '<span class="badge badge-sb">小盲</span>'  : '',
                    isBB  ? '<span class="badge badge-bb">大盲</span>'  : ''
                ].join('');
                const sub = p.folded ? '已弃牌' : p.stack === 0 ? '已全押' : p.bet > 0 ? `已下注 ${p.bet}` : '';
                const canAct = !state.roundActive;
                const actions = canAct ? `<div class="player-action-row">
                    ${p.stack === 0 ? `<button class="player-action-btn btn-rebuy" data-action="rebuy" data-idx="${i}">补充筹码</button>` : ''}
                    <button class="player-action-btn btn-remove" data-action="remove" data-idx="${i}">移除玩家</button>
                </div>` : '';
                return `<div class="player${isActive ? ' active' : ''}${p.folded ? ' folded' : ''}${p.stack === 0 && !p.folded ? ' allin' : ''}">
                    <div class="player-top">
                        <button type="button" class="player-name" data-action="rename" data-idx="${i}" title="修改姓名" aria-label="修改${p.name}的姓名">${p.name}</button>
                        <span class="player-badges">${badges}</span>
                    </div>
                    <div class="player-stack-row">
                        <span class="chip-glyph"></span>
                        <span class="player-stack mono tnum">${p.stack.toLocaleString()}</span>
                    </div>
                    <div class="player-sub">${sub}</div>
                    ${actions}
                </div>`;
            }).join('');

            // Hand history
            const histEl = $('handHistory');
            if (state.handHistory.length > 0) {
                histEl.classList.remove('hidden');
                $('historyList').innerHTML = [...state.handHistory].reverse().map(h =>
                    `<div class="history-entry">第 ${h.hand} 局：<strong>${h.winner}</strong> 赢得 <span class="mono">${h.amount}</span></div>`
                ).join('');
            } else {
                histEl.classList.add('hidden');
            }

            const on = state.roundActive && !atShowdown;
            const hasBet = state.currentBet > 0;
            const alreadyIn = curP ? curP.bet >= state.currentBet : false;
            $('amountRow').style.display      = on ? 'flex' : 'none';
            $('primaryActions').style.display = on ? 'flex' : 'none';
            $('foldBtn').style.display        = on && hasBet && !alreadyIn ? '' : 'none';
            $('callBtn').style.display        = on && hasBet && !alreadyIn ? '' : 'none';
            $('raiseBtn').style.display       = on && hasBet              ? '' : 'none';
            $('checkBtn').style.display       = on && (!hasBet || alreadyIn) ? '' : 'none';
            $('betBtn').style.display         = on && !hasBet             ? '' : 'none';

            syncTimerDisplay();
            debouncedSave();
        };

        // ── Helpers ──────────────────────────────────────────────
        const activePlayers = () => state.players.filter(p => !p.folded);

        const rebuildToAct = (excludeIdx = -1) => {
            state.toAct = new Set(
                state.players
                    .map((p, i) => ({ p, i }))
                    .filter(({ p, i }) => !p.folded && p.stack > 0 && i !== excludeIdx)
                    .map(({ i }) => i)
            );
        };

        // Centralize chip movement so handContrib stays in sync
        const addChips = (p, amount) => {
            p.stack -= amount; p.bet += amount;
            p.handContrib = (p.handContrib || 0) + amount;
            state.pot += amount;
        };

        // Compute main pot + side pots from per-player hand contributions.
        // Uses the level-slicing algorithm so partial contributions (e.g. fold pre-flop for less)
        // and multiple all-ins are handled correctly.
        const computePots = () => {
            const notFolded = state.players
                .map((p, i) => ({ i, invested: p.handContrib || 0, stack: p.stack, folded: p.folded }))
                .filter(c => !c.folded);
            const hasAllIn = notFolded.some(c => c.stack === 0);
            if (!hasAllIn) return [{ amount: state.pot, eligible: notFolded.map(c => c.i) }];

            // Pot levels = each unique all-in amount + maxInvested (uncapped tier)
            const levels = [...new Set(
                notFolded.filter(c => c.stack === 0).map(c => c.invested)
            )].sort((a, b) => a - b);
            const maxInvested = Math.max(...state.players.map(p => p.handContrib || 0));
            if (!levels.includes(maxInvested)) levels.push(maxInvested);

            let covered = 0;
            const pots = [];
            for (const level of levels) {
                if (level <= covered) continue;
                // Slice = sum of min(player_invested, level) - min(player_invested, covered) for ALL players
                const slice = state.players.reduce((sum, p) =>
                    sum + Math.max(0, Math.min(p.handContrib || 0, level) - Math.min(p.handContrib || 0, covered)), 0);
                const eligible = notFolded.filter(c => c.invested >= level).map(c => c.i);
                if (slice > 0 && eligible.length > 0) pots.push({ amount: slice, eligible });
                covered = level;
            }

            // Rounding guard: make sure pots sum to state.pot
            const total = pots.reduce((s, p) => s + p.amount, 0);
            if (total < state.pot && pots.length > 0) pots[pots.length - 1].amount += state.pot - total;
            return pots.length > 0 ? pots : [{ amount: state.pot, eligible: notFolded.map(c => c.i) }];
        };

        // ── Add player ───────────────────────────────────────────
        const addPlayer = () => {
            const name = els.playerName.value.trim().substring(0, CONFIG.MAX_NAME_LENGTH);
            const stack = parseInt(els.playerStack.value) || CONFIG.DEFAULT_STACK;
            if (!name) return toast('请输入玩家姓名', 'error');
            if (!/^[\p{Script=Han}a-zA-Z0-9\s\-_]+$/u.test(name)) return toast('姓名仅支持汉字、英文字母、数字、空格、短横线和下划线', 'error');
            if (state.players.length >= CONFIG.MAX_PLAYERS) return toast(`最多支持 ${CONFIG.MAX_PLAYERS} 位玩家`, 'error');
            if (stack <= 0 || isNaN(stack)) return toast('请输入有效的初始筹码数量', 'error');
            state.players.push({ name, stack, bet: 0, folded: false, handContrib: 0 });
            els.playerName.value = '';
            render();
        };

        // ── Rename player ────────────────────────────────────────
        const openRenameModal = idx => {
            if (!state.players[idx]) return;
            _renamePlayerIdx = idx;
            $('renamePlayerName').value = state.players[idx].name;
            $('renamePlayerModal').classList.add('active');
            $('renamePlayerName').focus();
            $('renamePlayerName').select();
        };

        const closeRenameModal = () => {
            $('renamePlayerModal').classList.remove('active');
            const button = els.players.querySelector(`[data-action="rename"][data-idx="${_renamePlayerIdx}"]`);
            _renamePlayerIdx = -1;
            if (button) button.focus();
        };

        const confirmRename = () => {
            const player = state.players[_renamePlayerIdx];
            if (!player) return;
            const name = $('renamePlayerName').value.trim();
            if (!name) return toast('请输入玩家姓名', 'error');
            if (name.length > CONFIG.MAX_NAME_LENGTH) return toast(`姓名最多 ${CONFIG.MAX_NAME_LENGTH} 个字符`, 'error');
            if (!/^[\p{Script=Han}a-zA-Z0-9\s\-_]+$/u.test(name)) return toast('姓名仅支持汉字、英文字母、数字、空格、短横线和下划线', 'error');
            player.name = name;
            render();
            saveState();
            closeRenameModal();
            toast('玩家姓名已更新');
        };

        // ── Remove player (only when round not active) ────────────
        const removePlayer = idx => {
            if (state.roundActive) return toast('牌局进行中无法移除玩家，请先结束或重置本局', 'error');
            if (!state.players[idx]) return;
            const name = state.players[idx].name;
            state.players.splice(idx, 1);
            if (idx < state.buttonPosition) state.buttonPosition--;
            if (state.buttonPosition >= state.players.length)
                state.buttonPosition = 0;
            toast(`${name} 已被移除`, 'error');
            render();
            saveState();
        };

        // ── Rebuy modal ──────────────────────────────────────────
        const openRebuyModal = idx => {
            _rebuyPlayerIdx = idx;
            $('rebuyPlayerLabel').textContent = state.players[idx].name;
            $('rebuyAmount').value = parseInt(els.playerStack.value) || CONFIG.DEFAULT_STACK;
            $('rebuyModal').classList.add('active');
        };

        const closeRebuyModal = () => {
            $('rebuyModal').classList.remove('active');
            _rebuyPlayerIdx = -1;
        };

        const confirmRebuy = () => {
            if (_rebuyPlayerIdx < 0) return;
            const amount = parseInt($('rebuyAmount').value);
            if (isNaN(amount) || amount <= 0) return toast('请输入有效的补充筹码数量', 'error');
            state.players[_rebuyPlayerIdx].stack += amount;
            toast(`${state.players[_rebuyPlayerIdx].name} 补充了 ${amount.toLocaleString()} 筹码`, 'win');
            closeRebuyModal();
            render();
        };

        // ── Start round ──────────────────────────────────────────
        const startRound = () => {
            if (state.players.length < CONFIG.MIN_PLAYERS)
                return toast(`至少需要 ${CONFIG.MIN_PLAYERS} 位玩家`, 'error');
            if (state.players.filter(p => p.stack > 0).length < CONFIG.MIN_PLAYERS)
                return toast('有筹码的玩家不足，请补充筹码或移除出局玩家', 'error');

            state.roundActive = true; state.pot = 0; state.street = 'preflop';
            state.handCount++;
            state.players.forEach(p => { p.bet = 0; p.folded = p.stack === 0; p.handContrib = 0; });

            const n = state.players.length;
            const isHeadsUp = n === 2;
            const blindsOn = $('enableBlinds').checked;

            if (blindsOn) {
                const sb = parseInt(els.smallBlind.value) || CONFIG.DEFAULT_SB;
                const bb = parseInt(els.bigBlind.value)   || CONFIG.DEFAULT_BB;
                const sbPos = isHeadsUp ? state.buttonPosition : (state.buttonPosition + 1) % n;
                const bbPos = isHeadsUp ? (state.buttonPosition + 1) % n : (state.buttonPosition + 2) % n;
                const sbP = state.players[sbPos], bbP = state.players[bbPos];
                addChips(sbP, Math.min(sb, sbP.stack));
                addChips(bbP, Math.min(bb, bbP.stack));
                state.currentBet = bb; state.minRaise = bb;
                state.currentPlayerIndex = isHeadsUp ? state.buttonPosition : (state.buttonPosition + 3) % n;
            } else {
                state.currentBet = 0; state.minRaise = 0;
                state.currentPlayerIndex = (state.buttonPosition + 1) % n;
            }

            for (let i = 0; i < n; i++) {
                if (!state.players[state.currentPlayerIndex].folded) break;
                state.currentPlayerIndex = (state.currentPlayerIndex + 1) % n;
            }

            state.toAct = new Set(state.players.map((p, i) => p.folded ? null : i).filter(i => i !== null));
            render();
        };

        // ── Street / round advance ───────────────────────────────
        const advanceStreet = () => {
            const next = { preflop: 'flop', flop: 'turn', turn: 'river', river: 'showdown' };
            state.street = next[state.street] || 'showdown';
        };

        const advanceRound = () => {
            state.players.forEach(p => p.bet = 0);
            state.currentBet = 0; state.minRaise = 0;
            advanceStreet();

            if (state.street === 'showdown') {
                state.toAct = new Set();
                toast('进入摊牌阶段，请分配底池', 'win');
                render(); return;
            }

            rebuildToAct();
            if (state.toAct.size === 0) { advanceRound(); return; } // everyone all-in, run the board

            const n = state.players.length;
            let idx = (state.buttonPosition + 1) % n;
            for (let i = 0; i < n; i++) {
                if (state.toAct.has(idx)) break;
                idx = (idx + 1) % n;
            }
            state.currentPlayerIndex = idx;
            render();
        };

        // ── Betting actions ──────────────────────────────────────
        const bet = () => {
            if (!state.roundActive) return;
            const amount = parseInt(els.amount.value);
            if (isNaN(amount) || amount <= 0) return toast('请输入有效的下注金额', 'error');
            const p = state.players[state.currentPlayerIndex];
            if (state.currentBet > 0) return toast('本轮已有下注，请使用加注', 'error');
            if (amount > p.stack)     return toast('筹码不足', 'error');
            addChips(p, amount);
            state.currentBet = amount; state.minRaise = amount;
            rebuildToAct(state.currentPlayerIndex);
            nextPlayer();
        };

        const raise = () => {
            if (!state.roundActive) return;
            const raiseAmt = parseInt(els.amount.value);
            if (isNaN(raiseAmt) || raiseAmt <= 0) return toast('请输入有效的加注金额', 'error');
            if (state.minRaise > 0 && raiseAmt < state.minRaise)
                return toast(`最少需加注 ${state.minRaise}`, 'error');
            const p = state.players[state.currentPlayerIndex];
            const toCall = state.currentBet - p.bet;
            const needed = toCall + raiseAmt;
            if (needed > p.stack) return toast('筹码不足', 'error');
            addChips(p, needed);
            const prev = state.currentBet;
            state.currentBet = p.bet; state.minRaise = p.bet - prev;
            rebuildToAct(state.currentPlayerIndex);
            nextPlayer();
        };

        const call = () => {
            if (!state.roundActive) return;
            const p = state.players[state.currentPlayerIndex];
            addChips(p, Math.min(state.currentBet - p.bet, p.stack));
            state.toAct.delete(state.currentPlayerIndex);
            nextPlayer();
        };

        const check = () => {
            if (!state.roundActive) return;
            if (state.players[state.currentPlayerIndex].bet < state.currentBet)
                return toast('当前不能过牌，请跟注或弃牌', 'error');
            state.toAct.delete(state.currentPlayerIndex);
            nextPlayer();
        };

        const fold = () => {
            if (!state.roundActive) return;
            state.players[state.currentPlayerIndex].folded = true;
            state.toAct.delete(state.currentPlayerIndex);
            nextPlayer();
        };

        // ── Next player ──────────────────────────────────────────
        const nextPlayer = () => {
            const active = activePlayers();
            if (active.length === 1 && state.roundActive) {
                const winner = active[0];
                const winAmt = state.pot;
                winner.stack += winAmt;
                state.handHistory.push({ hand: state.handCount, winner: winner.name, amount: winAmt });
                endRound();
                toast(`${winner.name} 赢得 ${winAmt} 筹码！`, 'win');
                return;
            }
            if (state.toAct.size === 0) { advanceRound(); return; }
            const n = state.players.length;
            let next = (state.currentPlayerIndex + 1) % n;
            for (let i = 0; i < n; i++) {
                if (state.toAct.has(next)) break;
                next = (next + 1) % n;
            }
            state.currentPlayerIndex = next;
            render();
        };

        // ── Round / table management ─────────────────────────────
        const endRound = () => {
            state.pot = 0; state.currentBet = 0; state.currentPlayerIndex = 0;
            state.roundActive = false; state.street = 'preflop';
            state.minRaise = 0; state.toAct = new Set();
            state.players.forEach(p => { p.bet = 0; p.folded = false; p.handContrib = 0; });
            state.buttonPosition = (state.buttonPosition + 1) % Math.max(1, state.players.length);
            render();
        };

        const moveButton = () => {
            if (state.players.length < 2) return;
            state.buttonPosition = (state.buttonPosition + 1) % state.players.length;
            render();
        };

        const resetTable = () => {
            state.pot = 0; state.currentBet = 0; state.currentPlayerIndex = 0;
            state.roundActive = false; state.street = 'preflop';
            state.minRaise = 0; state.toAct = new Set();
            state.players.forEach(p => { p.bet = 0; p.folded = false; p.handContrib = 0; });
            render();
        };

        // ── Award pot modal (with side pot support) ──────────────
        const openEmptyPotModal = () => {
            if (state.pot === 0)       return toast('底池已为空', 'error');
            if (!state.players.length) return toast('牌桌上还没有玩家', 'error');
            const pots = computePots();
            const modal = $('emptyPotModal');

            if (pots.length === 1) {
                $('singlePotRow').classList.remove('hidden');
                $('potSelectorContainer').classList.add('hidden');
                els.modalPotAmount.textContent = pots[0].amount;
                els.winnerSelect.innerHTML = '<option value="">请选择玩家…</option>' +
                    pots[0].eligible.map(i =>
                        `<option value="${i}">${state.players[i].name} (${state.players[i].stack.toLocaleString()})</option>`
                    ).join('');
            } else {
                $('singlePotRow').classList.add('hidden');
                $('potSelectorContainer').classList.remove('hidden');
                $('potSelectorContainer').innerHTML = pots.map((pot, pi) => `
                    <div class="pot-selector-row">
                        <div class="pot-preview">
                            <span class="muted">${pi === 0 ? '主池' : `边池 ${pi}`}</span>
                            <span class="pot-amount mono">${pot.amount}</span>
                        </div>
                        <select class="side-pot-select" data-pot="${pi}">
                            <option value="">请选择赢家…</option>
                            ${pot.eligible.map(i =>
                                `<option value="${i}">${state.players[i].name} (${state.players[i].stack.toLocaleString()})</option>`
                            ).join('')}
                        </select>
                    </div>`).join('');
                modal.dataset.pots = JSON.stringify(pots);
            }
            modal.classList.add('active');
        };

        const closeEmptyPotModal = () => {
            $('emptyPotModal').classList.remove('active');
            els.winnerSelect.value = '';
        };

        const awardPotToPlayer = () => {
            const modal = $('emptyPotModal');
            const isSingle = !$('singlePotRow').classList.contains('hidden');

            if (isSingle) {
                const idx = els.winnerSelect.value;
                if (idx === '') return toast('请选择玩家', 'error');
                const winner = state.players[parseInt(idx)];
                const amt = state.pot;
                els.pot.style.animation = 'potCollect .5s ease-out';
                setTimeout(() => {
                    winner.stack += amt;
                    state.handHistory.push({ hand: state.handCount, winner: winner.name, amount: amt });
                    els.pot.style.animation = '';
                    closeEmptyPotModal();
                    endRound();
                    toast(`${winner.name} 赢得 ${amt} 筹码！`, 'win');
                }, 500);
            } else {
                const selects = [...document.querySelectorAll('.side-pot-select')];
                const pots = JSON.parse(modal.dataset.pots || '[]');
                let valid = true;
                selects.forEach((sel, pi) => {
                    if (sel.value === '') {
                        toast(`请选择${pi === 0 ? '主池' : `边池 ${pi}`}的赢家`, 'error');
                        valid = false;
                    }
                });
                if (!valid) return;

                const assignments = selects.map((sel, pi) => ({
                    winnerIdx: parseInt(sel.value), amount: pots[pi].amount
                }));
                els.pot.style.animation = 'potCollect .5s ease-out';
                setTimeout(() => {
                    const parts = assignments.map(({ winnerIdx, amount }) => {
                        state.players[winnerIdx].stack += amount;
                        return `${state.players[winnerIdx].name} +${amount}`;
                    });
                    state.handHistory.push({
                        hand: state.handCount,
                        winner: assignments.map(a => state.players[a.winnerIdx].name).join('、'),
                        amount: assignments.reduce((s, a) => s + a.amount, 0)
                    });
                    els.pot.style.animation = '';
                    closeEmptyPotModal();
                    endRound();
                    toast(parts.join(' · '), 'win');
                }, 500);
            }
        };

        // ── Preset amounts ───────────────────────────────────────
        document.querySelectorAll('.preset').forEach(btn => {
            btn.onclick = () => {
                const p = state.players[state.currentPlayerIndex];
                const bb = parseInt(els.bigBlind.value) || CONFIG.DEFAULT_BB;
                const presets = {
                    min:       state.minRaise || bb,
                    half:      Math.max(1, Math.floor(state.pot / 2)),
                    twothirds: Math.max(1, Math.round(state.pot * 2 / 3)),
                    pot:       state.pot,
                    allin:     p ? Math.max(0, p.stack - Math.max(0, state.currentBet - p.bet)) : 0
                };
                els.amount.value = Math.max(0, presets[btn.dataset.preset] || 0);
            };
        });

        const amountStep = () => Math.max(1, state.minRaise || parseInt(els.bigBlind.value) || CONFIG.DEFAULT_BB);
        $('amountDown').onclick = () => els.amount.value = Math.max(0, (parseInt(els.amount.value) || 0) - amountStep());
        $('amountUp').onclick   = () => els.amount.value = (parseInt(els.amount.value) || 0) + amountStep();

        // ── Event bindings ───────────────────────────────────────
        $('addPlayer').onclick       = addPlayer;
        $('startRound').onclick      = startRound;
        $('moveButton').onclick      = moveButton;
        $('reset').onclick           = resetTable;
        $('betBtn').onclick          = bet;
        $('raiseBtn').onclick        = raise;
        $('callBtn').onclick         = call;
        $('checkBtn').onclick        = check;
        $('foldBtn').onclick         = fold;
        $('nextBtn').onclick         = () => { state.toAct.delete(state.currentPlayerIndex); nextPlayer(); };
        $('advanceRoundBtn').onclick = advanceRound;
        $('emptyPotBtn').onclick     = openEmptyPotModal;
        $('confirmEmptyPot').onclick = awardPotToPlayer;
        $('cancelEmptyPot').onclick  = closeEmptyPotModal;
        $('emptyPotModal').onclick   = e => { if (e.target === $('emptyPotModal')) closeEmptyPotModal(); };
        $('rebuyModal').onclick      = e => { if (e.target === $('rebuyModal')) closeRebuyModal(); };
        $('cancelRebuy').onclick     = closeRebuyModal;
        $('confirmRebuy').onclick    = confirmRebuy;
        $('rebuyAmount').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmRebuy(); } });
        $('timerBtn').onclick        = () => state.tournament.active ? stopTimer() : startTimer();
        $('cancelRename').onclick   = closeRenameModal;
        $('confirmRename').onclick  = confirmRename;
        $('renamePlayerModal').onclick = e => { if (e.target === $('renamePlayerModal')) closeRenameModal(); };
        $('renamePlayerModal').addEventListener('keydown', e => {
            if (e.isComposing) return;
            if (e.key === 'Enter') { e.preventDefault(); confirmRename(); }
            if (e.key === 'Escape') { e.preventDefault(); closeRenameModal(); }
        });

        // Event delegation for player Rename / Rebuy / Remove buttons
        els.players.addEventListener('click', e => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const idx = parseInt(btn.dataset.idx);
            if (btn.dataset.action === 'rename') openRenameModal(idx);
            if (btn.dataset.action === 'rebuy')  openRebuyModal(idx);
            if (btn.dataset.action === 'remove') removePlayer(idx);
        });

        els.playerName.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPlayer(); } });
        $('enableBlinds').addEventListener('change', e => {
            els.blindsControls.classList.toggle('hidden', !e.target.checked);
        });
        $('enableTournament').addEventListener('change', e => {
            $('tournamentControls').classList.toggle('hidden', !e.target.checked);
            if (!e.target.checked) stopTimer();
        });

        // ── Init ─────────────────────────────────────────────────
        const hasSaved = loadSavedState();
        if (hasSaved) {
            // Sync UI controls to restored state
            if (state.tournament.active) {
                $('enableTournament').checked = true;
                $('tournamentControls').classList.remove('hidden');
                resumeTimer();
            }
            if (state.tournament.sb) els.smallBlind.value = state.tournament.sb;
            if (state.tournament.bb) els.bigBlind.value   = state.tournament.bb;
            if (state.players.length > 0) toast('已恢复上次牌局，欢迎回来！');
        }
        render();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>

    <footer>
        <p>免费德州扑克计分器 · 无需注册 · 支持电脑和手机</p>
        <p><a href="about.html">关于</a> · <a href="guide.html">玩法指南</a> · <a href="blog.html">策略文章</a></p>
    </footer>
</body>
